<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="shell.page_navi">Navigation</title>
    <link rel="icon" type="image/webp" href="../shared/app-icon-dark.webp">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="../shared/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Panoptes">
    <meta name="theme-color" content="#0A2238">
    <script src="../shared/theme.js?v=14"></script>
    <script src="../shared/kartenquelle.js?v=6"></script>
    <script src="../shared/app-shell.js?v=pn39"></script>
    <link rel="stylesheet" href="../shared/styles.css?v=pn16">
    <style>
        .navi-page .main-content { padding: 0; }
        .navi { position: relative; margin: 0 28px 28px; height: calc(100vh - 190px); min-height: 460px;
                border-radius: 20px; overflow: hidden; border: 1px solid var(--sm-line); }
        #nMap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #0b2236; z-index: 0; }   /* eigene Ebene: Kartenquelle-Hinweis bleibt in der Karte, Panel bleibt bedienbar */
        .n-panel { position: absolute; top: 14px; left: 14px; width: 360px; max-height: calc(100% - 28px); overflow-y: auto;
                   background: rgba(7, 26, 43, .92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
                   border: 1px solid var(--sm-line); border-radius: 18px; padding: 16px; box-sizing: border-box; z-index: 5;
                   box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
                   /* Das Feld ist immer dunkel (liegt auf der dunklen Karte): Textfarben fest dunkel-Design,
                      sonst sind sie im hellen Design kaum lesbar. */
                   --on-surface: #e6f1f4; --on-surface-variant: #a9c7ce; --outline: #6f8f99; color: var(--on-surface); }
        /* Chromium 74 (WebView am Auto) ohne backdrop-filter: dichter statt Glas */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .n-panel { background: rgba(7, 26, 43, .97); } }
        .n-search { display: flex; align-items: center; background: rgba(255, 255, 255, .07); border: 1px solid var(--sm-line);
                    border-radius: 14px; padding: 0 12px; }
        .n-search svg { width: 20px; height: 20px; color: var(--sm-aqua); flex: none; }
        .n-search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--on-surface);
                          font: 600 16px var(--family-body, sans-serif); padding: 13px 10px; }
        .n-search button { background: transparent; border: 0; color: var(--outline); font-size: 18px; cursor: pointer; padding: 6px; }
        .n-results { list-style: none; margin: 8px 0 0; padding: 0; }
        .n-fav { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
        .n-fav button { border: 1px solid var(--sm-line); background: rgba(255,255,255,.06); color: var(--on-surface); border-radius: 999px;
                        padding: 6px 12px; font: 600 13px var(--family-body, sans-serif); cursor: pointer; }
        .n-results li { padding: 10px 8px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--on-surface); }
        .n-results li:hover, .n-results li:focus { background: rgba(95, 214, 230, .1); outline: 0; }
        .n-results li small { display: block; color: var(--outline); font-size: 12px; margin-top: 2px;
                              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .n-row { display: flex; align-items: center; margin-top: 12px; font-size: 13px; color: var(--on-surface-variant); }
        .n-row label { margin-right: 8px; }
        .n-row select { background: rgba(255, 255, 255, .07); color: var(--on-surface); border: 1px solid var(--sm-line);
                        border-radius: 10px; padding: 6px 8px; font: 600 13px var(--family-body, sans-serif); }
        .n-row .grow { flex: 1; }
        .n-dest { margin-top: 14px; }
        .n-dest h3 { font-family: var(--family-display); font-size: 18px; margin: 0; color: var(--on-surface); }
        .n-dest p { margin: 2px 0 0; color: var(--on-surface-variant); font-size: 13px; }
        .n-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-gap: 8px; margin-top: 12px; }
        .n-tile { background: rgba(4, 16, 27, .45); border-radius: 12px; padding: 10px 12px; }
        .n-tile .k { font-size: 11.5px; color: var(--outline); font-weight: 600; }
        .n-tile .v { font-family: var(--family-display); font-size: 20px; font-weight: 700; color: var(--on-surface); margin-top: 3px; }
        .n-tile .v small { font-size: 12px; color: var(--on-surface-variant); margin-left: 2px; }
        .n-tile .v.ok { color: var(--sm-lime); } .n-tile .v.warn { color: var(--status-warning); }
        .n-btns { display: flex; flex-wrap: wrap; margin-top: 12px; }
        .n-btns > * { margin: 0 8px 8px 0; }
        .nbtn { border: 1px solid var(--sm-line); background: rgba(255, 255, 255, .075); color: var(--on-surface); border-radius: 12px;
                padding: 11px 14px; font: 600 13.5px var(--family-body, sans-serif); cursor: pointer; display: inline-flex; align-items: center; }
        .nbtn svg { width: 16px; height: 16px; margin-right: 8px; }
        .nbtn.lime { background: var(--sm-lime); color: #1d2a00; border-color: transparent; }
        .nbtn:disabled { opacity: .5; cursor: default; }
        /* 0.1.38.14 (P4, Navi leichter): am Auto-Display große Knöpfe; Hinweis „Karte aus“; Zwischenstopps hinter „Mehr“ */
        .n-gross .nbtn { min-height: 56px; font-size: 16px; padding: 14px 18px; }
        /* zweiter Knopf (Im Werksnavi öffnen / Erste Etappe) gut sichtbar: Rahmen und Schrift in Aqua */
        .n-gross #nSendStop { border: 2px solid var(--sm-aqua); color: var(--sm-aqua); }
        .n-karte-aus { margin-bottom: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--sm-line); font-size: 13px; color: var(--on-surface-variant); }
        .n-mehr { background: transparent; border: 0; color: var(--sm-aqua); font: 600 13px var(--family-body, sans-serif); padding: 8px 0; cursor: pointer; }
        .n-stops { list-style: none; margin: 10px 0 0; padding: 0; }
        .n-stops li { display: flex; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--sm-line); font-size: 13px; color: var(--on-surface); }
        .n-stops .no { width: 24px; height: 24px; border-radius: 50%; background: var(--sm-lime); color: #1d2a00; flex: none;
                       display: flex; align-items: center; justify-content: center; font: 700 12px var(--family-display); margin-right: 10px; }
        .n-stops small { display: block; color: var(--outline); font-size: 12px; margin-top: 2px; }
        .n-stops small.n-occ.ok { color: var(--sm-lime); }
        .n-stops small.n-occ.warn { color: #FFB86B; }
        .n-occ-q { color: var(--outline); font-size: 11px; margin-top: 6px; }
        /* 0.1.38.10 (N1): Zwischenstopps Start → Z1…Z5 → Ziel, Bedienung nur über Knöpfe (kein Ziehen) */
        .n-via { margin-top: 10px; }
        .n-via-kopf { display: flex; align-items: center; font-size: 13px; font-weight: 600; color: var(--on-surface-variant); }
        .n-via-kopf .grow { flex: 1; }
        .n-via ol { list-style: none; margin: 6px 0 0; padding: 0; }
        .n-via li { padding: 8px 0; border-top: 1px solid var(--sm-line); font-size: 13px; color: var(--on-surface); }
        .n-via li.fest { color: var(--on-surface-variant); }
        .n-via .zeile { display: flex; align-items: center; }
        .n-via .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .n-via .no, .n-etappen .no.z { width: 26px; height: 24px; border-radius: 12px; background: var(--sm-aqua); color: #04101b; flex: none;
                       display: flex; align-items: center; justify-content: center; font: 700 11px var(--family-display); margin-right: 10px; }
        .n-via li.fest .no { background: rgba(255, 255, 255, .12); color: var(--on-surface); }
        .n-via .ctl { display: flex; flex-wrap: wrap; align-items: center; margin: 6px 0 0 36px; }
        .n-via .ctl > * { margin: 0 6px 6px 0; }
        .n-via .zeile .mini { margin-left: 6px; }
        .n-via .mini { border: 1px solid var(--sm-line); background: rgba(255, 255, 255, .06); color: var(--on-surface); border-radius: 10px;
                       min-width: 40px; height: 40px; padding: 0 10px; font: 700 14px var(--family-body, sans-serif); cursor: pointer; }
        .n-via .mini.on { background: var(--sm-lime); color: #1d2a00; border-color: transparent; }
        .n-via .mini:disabled { opacity: .35; cursor: default; }
        .n-via-hint { margin-top: 6px; font-size: 12.5px; color: var(--sm-aqua); }
        .n-via-hilfe { margin-top: 6px; font-size: 11.5px; color: var(--outline); line-height: 1.4; }
        .n-et-kopf { margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--on-surface-variant); }
        .n-etappen .no.ziel { background: #FF8A6B; }
        .n-etappen small.warn { color: var(--status-warning); }
        .pn-marker-via { border-color: var(--sm-aqua); color: #04101b; background: var(--sm-aqua); border-radius: 50%; }
        .n-nah { margin-top: 10px; }
        .n-tabs { display: flex; gap: 6px; }
        .n-tabs button { border: 1px solid var(--sm-line); background: rgba(255,255,255,.06); color: var(--on-surface); border-radius: 999px;
                         padding: 5px 12px; font: 600 12px var(--family-body, sans-serif); cursor: pointer; }
        .n-tabs button.on { background: var(--sm-aqua); color: #04101b; border-color: var(--sm-aqua); }
        .n-nah li { cursor: pointer; }
        .n-nah .basis { color: var(--outline); font-size: 11px; margin-top: 6px; }
        details.n-turns { margin-top: 10px; font-size: 13px; color: var(--on-surface-variant); }
        details.n-turns summary { cursor: pointer; color: var(--sm-aqua); font-weight: 600; padding: 6px 0; }
        details.n-turns ol { margin: 6px 0 0; padding-left: 20px; max-height: 240px; overflow-y: auto; }
        details.n-turns li { padding: 3px 0; }
        .n-msg { margin-top: 10px; font-size: 13px; color: var(--on-surface-variant); }
        .n-msg.err { color: var(--status-danger); }
        .n-warn { margin-top: 8px; font-size: 12px; color: var(--status-warning); }
        .n-busy { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--sm-aqua); border-right-color: transparent;
                  border-radius: 50%; animation: n-spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
        @keyframes n-spin { to { transform: rotate(360deg); } }
        .pn-marker-dest { border-color: #FF8A6B; color: #FF8A6B; border-radius: 50%; }
        .pn-marker-stop { border-color: var(--sm-lime); color: #1d2a00; background: var(--sm-lime); border-radius: 50%; }
        .pn-marker-free { border-color: var(--sm-lime); color: var(--sm-lime); }
        .pn-marker-busy { border-color: var(--status-warning); color: var(--status-warning); }
        .n-uw { background: rgba(4, 16, 27, .55); border: 1px solid var(--sm-line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
        .n-uw .hd { display: flex; align-items: center; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--outline); }
        .n-uw .hd .grow { flex: 1; }
        .n-uw .chip { border-radius: 999px; padding: 3px 10px; font: 700 12px var(--family-body, sans-serif); letter-spacing: 0; text-transform: none; }
        .n-uw .chip.passt { background: var(--sm-lime); color: #1d2a00; }
        .n-uw .chip.knapp { background: var(--status-warning); color: #2a1a00; }
        .n-uw .chip.reicht_nicht { background: var(--status-danger); color: #fff; }
        .n-uw .big { font-family: var(--family-display); font-size: 20px; font-weight: 700; color: var(--on-surface); margin-top: 8px; }
        .n-uw .big small { font-size: 13px; font-weight: 600; color: var(--on-surface-variant); margin-left: 6px; }
        .n-uw .pr-act { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .n-uw .ln { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 4px; }
        .n-uw .bar { position: relative; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .08); margin-top: 10px; }
        .n-uw .bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; background: var(--sm-aqua); }
        .n-uw .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--on-surface); }
        .n-uw .bar u { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--status-danger); text-decoration: none; }
        .n-uw .ln.warn { color: var(--status-warning); font-weight: 600; }
        .n-uw details { margin-top: 8px; font-size: 12.5px; }
        .n-uw details summary { cursor: pointer; color: var(--sm-aqua); font-weight: 600; }
        .n-fg { background: rgba(4, 16, 27, .72); border: 1px solid var(--sm-aqua); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
        .n-fg h3 { margin: 0 0 6px; font: 700 15px var(--family-display); color: var(--on-surface); }
        .n-fg p { margin: 0 0 6px; font-size: 13px; line-height: 1.45; color: var(--on-surface-variant); }
        .n-fg .pr-act { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .n-fg-weg { margin-top: 10px; font-size: 12px; }
        .n-fg-weg a { color: var(--sm-aqua); cursor: pointer; }
        @media (max-width: 720px) {
            .navi { margin: 0 0 0; border-radius: 0; border-left: 0; border-right: 0; height: calc(100vh - 230px); min-height: 520px; }
            .n-panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 55%; }
        }
        [data-android-embed="1"] .navi { height: 100vh; margin: 0; border-radius: 0; }
    </style>
</head>
<body class="navi-page">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2-7.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-flash" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
</svg>
<div class="app-layout">
    <div id="app-shell-mount"></div>
    <main class="main-content">
        <div class="navi">
            <div id="nMap"></div>
            <section class="n-panel" aria-label="Navigation">
                <div class="n-karte-aus" id="nKarteAus" hidden></div>
                <div class="n-uw n-fue" id="nFue" hidden></div>
                <div class="n-fg" id="nFg" hidden></div>
                <div class="n-uw" id="nPr" hidden></div>
                <div class="n-uw" id="nUw" hidden></div>
                <div class="n-search">
                    <svg><use href="#i-search"/></svg>
                    <input id="nQuery" type="search" autocomplete="off" placeholder="Wohin?" data-i18n-attr="placeholder:navi.where">
                    <button type="button" id="nClear" aria-label="Leeren" hidden>×</button>
                </div>
                <div class="n-fav" id="nFav" hidden></div>
                <ul class="n-results" id="nResults"></ul>
                <div class="n-via" id="nVia"></div>
                <div class="n-row">
                    <label for="nArrive" data-i18n="navi.arrive_min">Ankommen mit mind.</label>
                    <select id="nArrive"><option value="5">5 %</option><option value="10" selected>10 %</option><option value="20">20 %</option><option value="30">30 %</option></select>
                    <span class="grow"></span>
                    <button class="nbtn" type="button" id="nNearby"><svg><use href="#i-flash"/></svg><span data-i18n="navi.nearby">Säulen in der Nähe</span></button>
                </div>
                <div class="n-nah" id="nNah" hidden></div>
                <div id="nOut"></div>
                <div class="n-fg-weg" id="nFgWeg" hidden><a role="button" tabindex="0" data-i18n="navi.fg_weg">Freigabe „Ortssuche und Routen“ zurücknehmen</a></div>
            </section>
        </div>
    </main>
</div>

<script src="../shared/belegung.js?v=2"></script>
<script src="../shared/navi-etappen.js?v=1"></script>

<script>
(function () {
    'use strict';
    function $(id) { return document.getElementById(id); }
    function t(key, fallback, vars) { return window.PanoptesShell ? PanoptesShell.tr(key, fallback, vars) : fallback; }
    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function lang() { return (window.BYD && BYD.i18n && BYD.i18n.getLang && BYD.i18n.getLang()) || 'de'; }
    function fmt(v, dg) { try { return Number(v).toLocaleString(lang(), { minimumFractionDigits: dg || 0, maximumFractionDigits: dg || 0 }); } catch (e) { return Number(v).toFixed(dg || 0); } }
    function dur(min) { min = Math.round(min || 0); return min >= 60 ? Math.floor(min / 60) + ' h ' + ('0' + (min % 60)).slice(-2) : min + ' min'; }
    // 03.11.: Live-Belegung (frei/belegt) mit „Stand vor x min“; ohne Daten wird nichts angezeigt
    var PB = window.PanoptesBelegung;
    function standHtml(ms) {
        return ms == null ? '' : ' · <span data-stand="' + ms + '">' + esc(PB.standText(ms, t)) + '</span>';
    }
    // 0.1.38.10: am Auto-Display heißt es „Im Navi starten“ statt „Ziel ins Auto“ (eine Erkennung: PanoptesShell.istDisplay)
    function imAuto() { return !!(window.PanoptesShell && PanoptesShell.istDisplay && PanoptesShell.istDisplay()); }
    // Fahr-Modus am Display (anzeige.js setzt html[data-fahrt]); dort keine Suche und kein Kartentipp für Zwischenstopps
    function fahrt() { return document.documentElement.getAttribute('data-fahrt') === '1'; }
    var PE = window.PanoptesEtappen;
    // 0.1.38.10: eigene Rückfrage der Web-UI (BYD.utils.confirmDialog, core.js) statt des rohen confirm() mit
    // „Auf der Seite http://127.0.0.1 steht:“; Promise<boolean>. Rückfall nur, falls core.js fehlt.
    function frage(titel, text, ja, gefahr) {
        if (window.BYD && BYD.utils && typeof BYD.utils.confirmDialog === 'function') {
            return BYD.utils.confirmDialog({ title: titel, body: text, confirmLabel: ja,
                                             cancelLabel: t('common.cancel', 'Abbrechen'), danger: !!gefahr });
        }
        return Promise.resolve(window.confirm(text));
    }
    // 0.1.38.10 (G4): Panoptes-Führung nur am Auto-Display mit der App-Brücke (Fuehrung.kt); Handy/PC unverändert
    function fuehrungBruecke() { return imAuto() && !!window.AndroidBridge && typeof window.AndroidBridge.openNavigation === 'function'; }
    function fuehrungStand() {
        if (!fuehrungBruecke()) return {};
        try { return JSON.parse(window.AndroidBridge.fuehrungStand() || '{}') || {}; } catch (e) { return {}; }
    }
    function toast(msg, ok) { if (window.BYD && BYD.utils && BYD.utils.toast) BYD.utils.toast(msg, ok ? 'success' : 'error'); }
    function post(url, body) {
        return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            .then(function (r) {
                if (r.status === 429) throw new Error(t('navi.rate', 'Zu viele Anfragen – bitte 2 Minuten warten.'));
                return r.text().then(function (txt) {
                    try { return JSON.parse(txt); }
                    catch (e) { throw new Error(t('navi.slow', 'Der Planer hat nicht rechtzeitig geantwortet. Bitte nochmal versuchen.')); }
                });
            });
    }

    // ---------------- Freigabe „Ortssuche und Routen“ (0.1.10, Regel 2: Standard aus, eine Einwilligung).
    // Suche, Route und Säulen in der Nähe gehen über den Kern an den Routenplaner – mit Suchtext, Auto-Standort,
    // Ziel und Akkustand. Erst nach ausdrücklichem „Erlauben“ auf diesem Gerät; „Ins Auto senden“ bleibt lokal.
    var FG = {
        KEY: 'pn.navi.freigabe',
        warte: null,
        an: function () { try { return localStorage.getItem(this.KEY) === 'ja'; } catch (e) { return false; } },
        setzen: function (an) {
            try { if (an) localStorage.setItem(this.KEY, 'ja'); else localStorage.removeItem(this.KEY); } catch (e) {}
            $('nFgWeg').hidden = !this.an();
            return this.an() === !!an;
        },
        frag: function () {
            var self = this;
            if (this.an()) return Promise.resolve(true);
            if (this.warte) return this.warte;
            var box = $('nFg');
            box.innerHTML = '<h3>' + esc(t('navi.fg_titel', 'Ortssuche und Routen')) + '</h3>'
                + '<p>' + esc(t('navi.fg_text', 'Für Suche, Route und Säulen in der Nähe fragt Panoptes den Routenplaner (byd.serveone.at). Dabei gehen hinaus: dein Suchtext, der Standort des Autos, das Ziel und der Akkustand.')) + '</p>'
                + '<p>' + esc(imAuto() ? t('navi.fg_text2_display', 'Ohne Freigabe geht nichts hinaus. „Starten“ braucht sie nicht. Die Freigabe gilt für dieses Display und lässt sich unten auf dieser Seite zurücknehmen.')
                                       : t('navi.fg_text2', 'Ohne Freigabe geht nichts hinaus. „Ins Auto senden“ braucht sie nicht. Die Freigabe gilt für dieses Gerät bzw. diesen Browser und lässt sich unten auf dieser Seite zurücknehmen.')) + '</p>'
                + '<div class="pr-act"><button class="nbtn" type="button" id="nFgJa">' + esc(t('navi.fg_ja', 'Erlauben')) + '</button>'
                + '<button class="nbtn ghost" type="button" id="nFgNein">' + esc(t('navi.fg_nein', 'Nicht jetzt')) + '</button></div>';
            box.hidden = false;
            this.warte = new Promise(function (fertig) {
                function ende(ok) { box.hidden = true; box.innerHTML = ''; self.warte = null; fertig(ok); }

    // ---------------- Unterwegs („Reicht es noch?“, Kern GET /api/navi/unterwegs). Nur lesen, nie ein Befehl.
    var UW = {

        zeige: function (d) {

            box.hidden = false;
            if (!d.aktiv) {   // kein Mitglieds-Schlüssel: Einrichtung einmal zeichnen

            var dPP = Number(d.delta) || 0;

                + '<div class="big">' + esc(t('navi.uw_arrive', 'Ankunft mit ca. {p} %', { p: fmt(d.prognoseProzent) }))
                + '<small>' + esc(ziel) + (n.km != null ? ' · ' + esc(t('navi.uw_km', 'noch {km} km', { km: fmt(n.km) })) : '') + '</small></div>'

                + (d.reserve > 0 ? '<u style="left:' + pct(d.reserve) + '%" title="' + esc(t('navi.uw_reserve_mark', 'Reserve')) + '"></u>' : '') + '</div>'
                + '<div class="ln">' + esc(t('navi.uw_now', 'Jetzt {i} %, laut Plan {s} % ({d} Prozentpunkte)', {

        // 0.1.19: Planer meldet „neu planen“ (§17, Einwilligung planner.abweichung). Nur hier in der Navi-Seite,
        // dezent, ohne Ton und ohne Fenster über anderen Apps (A+). „Neu planen“ rechnet die Route zum selben Ziel
        // ab der aktuellen Position neu (wie eine eigene Suche); ins Navi geht erst etwas nach „Ziel ins Auto“.
        neu: function (h) {

            var g = (h.gruende || []).filter(Boolean).slice(0, 2).join(' · ');
            return '<div class="uw-neu" role="status" style="margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--outline-variant, var(--outline));">'
                + '<div class="ln" style="margin-top:0;font-weight:600">' + esc(t('navi.uw_neu', 'Die Fahrt weicht vom Plan ab – neu planen?')) + '</div>'
                + (g ? '<div class="ln">' + esc(g) + '</div>' : '')
                + '<div class="pr-act"><button class="nbtn" type="button" data-uw="neu">' + esc(t('navi.uw_neu_btn', 'Neu planen')) + '</button>'
                + '<button class="nbtn ghost" type="button" data-uw="weg">' + esc(t('navi.uw_neu_weg', 'Nicht jetzt')) + '</button></div></div>';

        neuVerdrahten: function (box, h) {
            var self = this;
            if (!h || !h.ziel) return;
            var b = box.querySelector('[data-uw="neu"]'), w = box.querySelector('[data-uw="weg"]');
            if (b) b.onclick = function () {
                N.choose({ name: h.ziel.name || t('navi.uw_dest', 'Ziel'), full: h.ziel.name || '', lat: h.ziel.lat, lng: h.ziel.lon,
                           via: Array.isArray(h.via) ? h.via : [] });

            if (w) w.onclick = function () {

        },
        // Belegung des nächsten Stopps (Kern: nur < 60 km, kein Ziel). voll → Ausweich-Säule nennen.
        belegung: function (n) {
            var b = n && n.belegung;
            if (!b || !b.gefunden || !b.statusBekannt) return '';
            var name = n.name || t('navi.uw_stop', 'Nächster Stopp');
            var stand = standHtml(PB.standMs(b.standVorS, this.empfangen));
            if (b.voll) {
                var a = b.ausweich;
                return '<div class="ln warn">' + esc(t('navi.uw_full', '{s} ist gerade voll', { s: name }))
                    + (a && a.name ? ' · ' + esc(t('navi.uw_alt', 'Ausweich-Säule: {name} · {km} km weiter', { name: a.name, km: fmt(a.km, 1) }))
                        + (a.frei != null ? ' (' + esc(t('navi.uw_free', '{n} frei', { n: a.frei })) + ')' : '') : '') + stand + '</div>';
            }
            return '<div class="ln">' + esc(t('navi.uw_occ', '{s}: {f} von {p} Ladepunkten frei', { s: name, f: b.frei, p: b.ladepunkte }))
                + (b.defekt > 0 ? ' · ' + esc(t('navi.uw_broken', '{n} defekt', { n: b.defekt })) : '') + stand + '</div>';
        },
        // Soll gegen Ist über die km (Kern verlauf, ≤ 50 Punkte). Erst ab 2 Punkten.
        kurve: function (v, reserve) {
            if (!Array.isArray(v) || v.length < 2) return '';
            var W = 300, H = 90, P = 4, maxKm = 0, lo = 100, hi = 0;
            v.forEach(function (p) {
                maxKm = Math.max(maxKm, Number(p.km) || 0);
                [p.soll, p.ist].forEach(function (x) { if (x != null && isFinite(x)) { lo = Math.min(lo, x); hi = Math.max(hi, x); } });
            });
            if (reserve > 0) lo = Math.min(lo, reserve);
            lo = Math.max(0, Math.floor(lo / 10) * 10); hi = Math.min(100, Math.ceil(hi / 10) * 10);
            if (hi <= lo) hi = lo + 10;
            if (!(maxKm > 0)) return '';
            function x(km) { return (P + (W - 2 * P) * km / maxKm).toFixed(1); }
            function y(pc) { return (P + (H - 2 * P) * (1 - (pc - lo) / (hi - lo))).toFixed(1); }
            function linie(k) {
                return v.filter(function (p) { return p[k] != null && isFinite(p[k]); })
                    .map(function (p, i) { return (i ? 'L' : 'M') + x(p.km) + ' ' + y(p[k]); }).join(' ');
            }
            var res = reserve > 0 ? '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + y(reserve) + '" y2="' + y(reserve) + '" stroke="var(--status-danger)" stroke-dasharray="3 3" stroke-width="1"/>' : '';
            return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" style="margin-top:10px;display:block" role="img" aria-label="'
                + esc(t('navi.uw_curve', 'Ladestand laut Plan und tatsächlich über die Strecke')) + '">'
                + res
                + '<path d="' + linie('soll') + '" fill="none" stroke="var(--on-surface-variant)" stroke-width="1.5" stroke-dasharray="5 3"/>'
                + '<path d="' + linie('ist') + '" fill="none" stroke="var(--sm-aqua)" stroke-width="2.2"/>'
                + '<text x="' + (W - P) + '" y="' + (H - 2) + '" text-anchor="end" font-size="10" fill="var(--outline)">' + esc(fmt(maxKm) + ' km') + '</text>'
                + '<text x="' + P + '" y="11" font-size="10" fill="var(--outline)">' + esc(hi + ' %') + '</text>'
                + '</svg><div class="ln"><span style="color:var(--sm-aqua)">━</span> ' + esc(t('navi.uw_leg_ist', 'tatsächlich'))
                + ' &nbsp; <span>┅</span> ' + esc(t('navi.uw_leg_soll', 'laut Plan')) + '</div>';
        },
        einstellungen: function () {
            var self = this, ziel = $('nUwSet');
            if (!ziel || !window.PanoptesEinstellungen) return;
            (this.store ? Promise.resolve(this.store) : PanoptesEinstellungen.laden()).then(function (s) {
                if (!s) return;
                self.store = s;
                // 0.1.9.1 (F3): kein Mitglieds-Schlüssel-Feld mehr; verbunden wird über Einstellungen → Alle Einstellungen → Routenplaner-Konto
                // 0.1.10 (Kern 5): Reserve = laden.ankunftSocMin (Gruppe „laden“, planner.reserve ist entfallen)
                if (s.feld('laden.ankunftSocMin')) s.zeichne(ziel, { gruppe: 'laden', nur: ['laden.ankunftSocMin'] });

                    h.className = 'ln';
                    h.innerHTML = esc(t('navi.uw_altzugang', 'Du nutzt noch den alten Zugang mit Mitglieds-Schlüssel. Bitte verbinde Panoptes neu mit dem Routenplaner.'))
                        + ' <a href="system.html#planerKarte" style="color:var(--sm-aqua);font-weight:600">' + esc(t('system.planer_connect', 'Mit Routenplaner verbinden')) + '</a>';
                    ziel.appendChild(h);
                }
            });
        },
        start: function () {
            var self = this;
            this.laden();
            setInterval(function () { self.laden(); }, 15000);

        }

    // ---------------- Route vom Planer (Kern 4: GET /api/navi/planer-route, POST …/annehmen | …/ablehnen {id}).
    // Annehmen setzt die Route nur für „Reicht es noch?“ – es geht dabei nichts ans Navi im Auto.
    var PR = {
        id: null, laeuft: false, meldung: null,

            h += '<div class="ln">' + esc(imAuto() ? t('navi.pr_explain_display', 'Übernehmen heißt: Panoptes prüft unterwegs, ob der Akku bis zum Ziel reicht. Die Navigation startet dabei nicht.')
                                                  : t('navi.pr_explain', 'Übernehmen heißt: Panoptes prüft unterwegs, ob der Akku bis zum Ziel reicht. Ans Navi im Auto geht dabei nichts.')) + '</div>'
                + '<div class="pr-act"><button class="nbtn lime" type="button" data-pr="annehmen">' + esc(t('navi.pr_accept', 'Übernehmen')) + '</button>'
                + '<button class="nbtn" type="button" data-pr="ablehnen">' + esc(t('navi.pr_reject', 'Ablehnen')) + '</button></div>'

        GRUND: {

                            + '<div class="ln">' + esc(t('navi.pr_ok_off', 'Route übernommen. Überwacht wird sie erst, wenn die Unterwegs-Hilfe eingeschaltet ist.')) + '</div>'
                            + '<div class="ln"><a href="system.html#datenschutz" style="color:var(--sm-aqua);font-weight:600">' + esc(t('datenfreigaben.titel', 'Datenfreigaben')) + '</a></div>';

    // ---------------- Band „Führung läuft“ (G4): Stand lokal über die App-Brücke, nichts übers Netz, keine Position.

    var N = window.Navi = {

            this.status = st;
            var c = this.car();
            if (c && this.map) this.map.setCar({ lng: c.lng, lat: c.lat, heading: c.heading });
        },

        // ---------- Ortssuche (Planer, POST – Suchtext steht in keiner URL)
        search: function (q) {
            var self = this, gen = ++this.searchGen;
            var list = $('nResults');
            if (q.length < 3) { list.innerHTML = ''; return; }
            planer('/api/navi/orte', { q: q, limit: 6 }).then(function (d) {
                if (gen !== self.searchGen) return;
                list.innerHTML = '';
                var orte = (d && d.orte) || [];
                if (!orte.length) { list.innerHTML = '<li class="n-msg">' + esc(t('navi.nothing', 'Nichts gefunden')) + '</li>'; return; }
                orte.forEach(function (o) {
                    var li = document.createElement('li');
                    li.tabIndex = 0;
                    li.innerHTML = esc(o.kurz || o.name) + '<small>' + esc(o.name) + '</small>';
                    li.onclick = li.onkeydown = function (e) {
                        if (e.type === 'keydown' && e.key !== 'Enter') return;
                        self.pick({ name: o.kurz || o.name, full: o.name, lat: o.lat, lng: o.lon }, 'suche');
                    };
                    list.appendChild(li);
                });
            }).catch(function (e) {
                if (gen === self.searchGen) list.innerHTML = '<li class="n-msg err">' + esc(e.message || t('navi.offline', 'Planer nicht erreichbar')) + '</li>';
            });
        },

        // ---------- Ziel aus Link (POST /api/navi/link). Kurzlinks erst nach Tippen auf „Nachfragen“:
        // dann fragt das Auto per HEAD beim Kurzlink-Dienst nach, wohin er zeigt (nur der Link geht hinaus).
        istLink: function (q) {
            return /^(https?:\/\/|geo:)/i.test(q) || /(^|\s)(https?:\/\/)?(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?waze\.com\/|maps\.google\.)/i.test(q)
                || /\shttps?:\/\//i.test(q);
        },
        linkZiel: function (q, aufloesen) {
            var self = this, list = $('nResults'), gen = this.searchGen;
            list.innerHTML = '<li class="n-msg">' + esc(t('ziellink.lese', 'Link wird gelesen …')) + '</li>';
            post('/api/navi/link', { link: q, aufloesen: !!aufloesen }).then(function (d) {
                if (gen !== self.searchGen) return;
                if (d && d.ok) {
                    self.pick({ name: d.name || t('ziellink.ziel', 'Ziel aus dem Link'), full: (+d.lat).toFixed(5) + ', ' + (+d.lng).toFixed(5), lat: +d.lat, lng: +d.lng }, 'suche');
                    return;
                }
                var g = (d && d.grund) || '';
                if (g === 'kurzlink') {
                    list.innerHTML = '<li class="n-msg">' + esc(t('ziellink.kurz', 'Kurzlink ohne Koordinaten. Panoptes kann einmal beim Kurzlink-Dienst nachfragen, wohin er zeigt. Dabei geht nur dieser Link hinaus, keine Position.'))
                        + ' <button class="btn" type="button" id="nLinkFrag">' + esc(t('ziellink.fragen', 'Nachfragen')) + '</button></li>';
                    $('nLinkFrag').onclick = function () { self.linkZiel(q, true); };
                    return;
                }
                var texte = {
                    kein_ort: t('ziellink.kein_ort', 'In diesem Link steht kein Punkt, nur ein Suchtext. Bitte den Ort teilen, nicht die Suche.'),
                    unbekannter_link: t('ziellink.unbekannt', 'Diesen Link kennt Panoptes nicht. Es gehen Google Maps, Waze, geo:, OpenStreetMap und Apple Karten.'),
                    nicht_aufloesbar: t('ziellink.nicht_aufloesbar', 'Der Kurzlink ließ sich nicht auflösen. Bitte den langen Link teilen.')
                };
                list.innerHTML = '<li class="n-msg err">' + esc(texte[g] || texte.unbekannter_link) + '</li>';
            }).catch(function () {
                if (gen === self.searchGen) list.innerHTML = '<li class="n-msg err">' + esc(t('ziellink.nicht_aufloesbar', 'Der Kurzlink ließ sich nicht auflösen. Bitte den langen Link teilen.')) + '</li>';
            });
        },

        choose: function (dest) {
            this.dest = dest;
            // „Neu planen“ bringt die noch offenen Zwischenziele mit; sonst bleibt die eigene Liste
            if (Array.isArray(dest.via)) { this.via = PE.ausListe(dest.via); this.viaNeu = false; }
            $('nResults').innerHTML = '';
            $('nQuery').value = dest.name;
            $('nClear').hidden = false;
            this.viaZeigen();
            this.map.setMarkers(this.grundMarker());
            this.route();
        },

        clear: function () {
            this.dest = null; this.plan = null;
            $('nQuery').value = ''; $('nClear').hidden = true; $('nResults').innerHTML = ''; $('nOut').innerHTML = '';
            this.map.setLines([]); this.map.setMarkers(this.grundMarker());
            this.viaZeigen();
            this.map.flyToCar();
        },

        // ---------- Zwischenstopps (0.1.38.10, N1): Start → Z1…Z5 → Ziel. Ein ausgewählter Ort wird Ziel, nach
        // „+ Zwischenstopp“ einmal Zwischenstopp. Während der Fahrt nur aus Favoriten und „Säulen in der Nähe“.
        pick: function (o, quelle) {
            if (!this.viaNeu) { this.choose(o); return; }
            if ((quelle === 'suche' || quelle === 'karte') && fahrt()) {
                toast(t('navi.via_fahrt', 'Suche und Karte gehen während der Fahrt nicht. Nimm einen ★-Favoriten oder eine Säule in der Nähe.'), false);
                return;
            }
            if (quelle === 'saeule') o = { name: o.name, lat: o.lat, lng: o.lng, laden: true };
            if (!PE.hinzu(this.via, o)) { toast(t('navi.via_max', 'Höchstens {n} Zwischenstopps.', { n: PE.MAX }), false); return; }
            this.viaNeu = false;
            $('nResults').innerHTML = '';
            $('nQuery').value = this.dest ? this.dest.name : '';
            $('nClear').hidden = !this.dest;
            toast(t('navi.via_hinzu', '„{name}“ ist Zwischenstopp {n}.', { name: o.name, n: this.via.length }), true);
            this.viaGeaendert();
        },
        viaGeaendert: function () {
            this.viaZeigen();
            if (this.dest) this.route();
            else this.map.setMarkers(this.grundMarker());
        },
        grundMarker: function () {
            var ms = [];
            this.via.forEach(function (s, i) { ms.push({ lat: s.lat, lng: s.lng, kind: 'via', label: 'Z' + (i + 1), title: s.name }); });
            if (this.dest) ms.push({ lat: this.dest.lat, lng: this.dest.lng, kind: 'dest', label: '◎', title: this.dest.full || this.dest.name });
            return ms;
        },
        viaZeigen: function () {
            var self = this, box = $('nVia'), L = this.via;
            // 0.1.38.14: ohne Zwischenstopps nur ein kleines „Mehr: Zwischenstopps“ – der Weg Ziel → Vorschau → Start bleibt frei
            if (!L.length && !this.viaNeu && !this.viaMehr) {
                box.innerHTML = '<button class="n-mehr" type="button" data-v="mehr">' + esc(t('navi.via_mehr', 'Mehr: Zwischenstopps')) + '</button>';
                box.querySelector('[data-v="mehr"]').onclick = function () { self.viaMehr = true; self.viaZeigen(); };
                return;
            }
            var h = '<div class="n-via-kopf"><span>' + (L.length ? esc(t('navi.via_titel', 'Zwischenstopps')) + ' (' + L.length + '/' + PE.MAX + ')' : '') + '</span><span class="grow"></span>';
            if (this.viaNeu) h += '<button class="nbtn" type="button" data-v="abbruch">' + esc(t('navi.via_abbruch', 'Abbrechen')) + '</button>';
            else if (L.length < PE.MAX) h += '<button class="nbtn" type="button" data-v="neu">+ ' + esc(t('navi.via_neu', 'Zwischenstopp')) + '</button>';
            h += '</div>';
            if (this.viaNeu) h += '<div class="n-via-hint">' + esc(fahrt()
                ? t('navi.via_wie_fahrt', 'Tipp auf einen ★-Favoriten oder unter „Säulen in der Nähe“ auf eine Säule. Suchen geht nur im Stand.')
                : t('navi.via_wie', 'Such einen Ort oder tipp auf einen ★-Favoriten, eine Säule in der Nähe oder die Karte. Das wird der nächste Zwischenstopp.')) + '</div>';
            if (L.length) {
                h += '<ol><li class="fest"><div class="zeile"><span class="no">●</span><span class="nm">' + esc(t('navi.via_start', 'Start: Standort des Autos')) + '</span></div></li>';
                L.forEach(function (s, i) {
                    h += '<li><div class="zeile"><span class="no">Z' + (i + 1) + '</span><span class="nm">' + esc(s.name) + '</span>'
                        + '<button class="mini" type="button" data-v="hoch" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="' + esc(t('navi.via_hoch', 'Nach vorne')) + '">↑</button>'
                        + '<button class="mini" type="button" data-v="runter" data-i="' + i + '"' + (i === L.length - 1 ? ' disabled' : '') + ' aria-label="' + esc(t('navi.via_runter', 'Nach hinten')) + '">↓</button>'
                        + '<button class="mini" type="button" data-v="weg" data-i="' + i + '" aria-label="' + esc(t('navi.via_weg', 'Entfernen')) + '">×</button>'
                        + '</div><div class="ctl">'
                        + '<button class="mini" type="button" data-v="halt" data-i="' + i + '" title="' + esc(t('navi.via_halt_titel', 'Aufenthalt ändern')) + '">'
                        + esc(s.aufenthalt_min ? t('navi.via_halt', '{m} min Halt', { m: s.aufenthalt_min }) : t('navi.via_halt0', 'Kein Halt')) + '</button>'
                        + '<button class="mini' + (s.laden ? ' on' : '') + '" type="button" data-v="laden" data-i="' + i + '" aria-pressed="' + (s.laden ? 'true' : 'false') + '">'
                        + esc(t('navi.via_laden', 'Hier laden')) + '</button>'
                        + '</div></li>';
                });
                h += '<li class="fest"><div class="zeile"><span class="no">◎</span><span class="nm">'
                    + esc(this.dest ? t('navi.via_ziel', 'Ziel: {name}', { name: this.dest.name }) : t('navi.via_kein_ziel', 'Ziel: noch nicht gewählt')) + '</span></div></li></ol>'
                    + '<div class="n-via-hilfe">' + esc(t('navi.via_hilfe', 'Panoptes plant in dieser Reihenfolge und rechnet nötige Ladestopps dazu. ↑ und ↓ ändern die Reihenfolge. „Hier laden“ heißt: Du lädst dort selbst (ohne Angabe 11 kW Wechselstrom). Die Liste wird nicht gespeichert.')) + '</div>';
            }
            box.innerHTML = h;
            Array.prototype.forEach.call(box.querySelectorAll('[data-v]'), function (b) {
                b.onclick = function () {
                    var was = b.getAttribute('data-v'), i = +b.getAttribute('data-i'), s = self.via[i];
                    if (was === 'neu') { self.viaNeu = true; self.viaZeigen(); if (!fahrt()) { $('nQuery').value = ''; $('nQuery').focus(); } return; }
                    if (was === 'abbruch') { self.viaNeu = false; $('nResults').innerHTML = ''; $('nQuery').value = self.dest ? self.dest.name : ''; self.viaZeigen(); return; }
                    if (was === 'halt' && s) s.aufenthalt_min = PE.naechsterAufenthalt(s.aufenthalt_min);
                    else if (was === 'laden' && s) s.laden = !s.laden;
                    else if (was === 'hoch') PE.schieben(self.via, i, -1);
                    else if (was === 'runter') PE.schieben(self.via, i, 1);
                    else if (was === 'weg') PE.weg(self.via, i);
                    self.viaGeaendert();
                };
            });
        },

        // ---------- Route (Planer: Route, Ladestopps, Ankunfts-Akku)
        route: function () {
            var self = this, car = this.car(), dest = this.dest;
            var out = $('nOut');
            if (!dest) return;
            if (!car) {
                out.innerHTML = this.destHtml() + '<div class="n-msg err">' + esc(imAuto() ? t('navi.no_car_display', 'Kein Standort vom Auto – nur „Starten“ möglich.')
                                                       : t('navi.no_car', 'Kein Standort vom Auto – nur „Ins Auto senden“ möglich.')) + '</div>' + this.sendHtml(false);
                this.wireSend();
                this.map.fit([[dest.lng, dest.lat]]);
                return;
            }
            out.innerHTML = this.destHtml() + '<div class="n-msg"><span class="n-busy"></span>' + esc(t('navi.calc', 'Route, Säulen und Preise werden gerechnet … (lange Strecken bis zu 2 Minuten)')) + '</div>';
            var soc = this.soc();
            var body = {
                start: [+car.lat.toFixed(5), +car.lng.toFixed(5)], ziel: [+dest.lat.toFixed(5), +dest.lng.toFixed(5)],
                soc_start: soc !== null ? Math.round(soc) : 80, soc_ziel_min: +$('nArrive').value, fahrzeug: null
            };
            // 0.1.19: „Neu planen“ aus der Plan-Abweichung behält die noch vor uns liegenden Zwischenziele (Planer §17);
            // 0.1.38.10: sie stehen in der Zwischenstopp-Liste (choose), die Liste geht als via mit
            var via = PE.viaBody(this.via);
            if (via.length) body.via = via;
            var gen = ++this.planGen;   // Liste geändert, während noch gerechnet wird: nur die neueste Antwort zählt
            planer('/api/navi/plan', body).then(function (d) {
                if (self.dest !== dest || gen !== self.planGen) return;
                if (!d || d.fehler || !d.route) throw new Error((d && d.fehler) || t('navi.offline', 'Planer nicht erreichbar'));
                self.plan = d;
                self.planEmpfangen = Date.now();
                self.draw(d);
            }).catch(function (e) {
                if (self.dest !== dest || gen !== self.planGen) return;
                self.plan = null;
                out.innerHTML = self.destHtml() + '<div class="n-msg err">' + esc(e.message) + '</div>' + self.sendHtml(false);
                self.wireSend();
            });
        },

        destHtml: function () {
            var d = this.dest;
            return '<div class="n-dest"><h3>' + esc(d.name) + '</h3>' + (d.full && d.full !== d.name ? '<p>' + esc(d.full) + '</p>' : '') + '</div>';
        },
        // withStop: true = erster Ladestopp, 'etappe' = erste Etappe (mit Zwischenstopps; das Navi im Auto kennt nur ein Ziel).
        // G4: Ist die Panoptes-Führung da, startet „Starten“ sie mit allen Zwischenstopps; der zweite Knopf öffnet das Werksnavi.
        sendHtml: function (withStop) {
            if (this.fuehrungAn()) {
                return '<div class="n-btns"><button class="nbtn lime" type="button" id="nSend"><svg><use href="#i-send"/></svg>'
                    + esc(t('navi.send_display', 'Starten')) + '</button>'
                    + '<button class="nbtn" type="button" id="nSendStop">' + esc(t('navi.send_werk_display', 'Im Werksnavi öffnen')) + '</button></div>'
                    + '<div class="n-msg">' + esc(t('navi.fue_hinweis', '„Starten“ öffnet die Panoptes-Führung mit allen Zwischenstopps. Los geht es erst mit dem Tipp auf Start in der Karte.')) + '</div>';
            }
            var zweit = withStop === 'etappe'
                ? (imAuto() ? t('navi.send_first_display', 'Erste Etappe starten') : t('navi.send_first', 'Erste Etappe ins Auto'))
                : (imAuto() ? t('navi.send_stop_display', 'Mit Ladestopp starten') : t('navi.send_stop', 'Ersten Ladestopp ins Auto'));
            return '<div class="n-btns"><button class="nbtn lime" type="button" id="nSend"><svg><use href="#i-send"/></svg>'
                + esc(imAuto() ? t('navi.send_display', 'Starten') : t('navi.send', 'Ziel ins Auto')) + '</button>'
                + (withStop ? '<button class="nbtn" type="button" id="nSendStop"><svg><use href="#i-flash"/></svg>' + esc(zweit) + '</button>' : '')
                + '</div>';
        },
        // G4: Führung nur am Display mit Brücke und wenn sie eine Route rechnen kann (Fuehrung.verfuegbar)
        fuehrungAn: function () { return fuehrungBruecke() && fuehrungStand().verfuegbar === true; },
        // Auftrag ohne Route und ohne Position: Ziel und Zwischenstopps (Ladestopps erst mit G6), plan_id wenn da
        fuehre: function (btn) {
            var d = this.dest, a = { ziel: { name: d.name, lat: d.lat, lon: d.lng }, etappen: [] };
            if (this.plan && this.plan.plan_id) a.plan_id = String(this.plan.plan_id);
            this.via.forEach(function (s) { a.etappen.push({ art: 'zwischenziel', name: s.name, lat: s.lat, lon: s.lng }); });
            var r = 'error';
            try { r = window.AndroidBridge.openNavigation(JSON.stringify(a)); } catch (e) {}
            if (r === 'ok') return;
            // Rückfall: kein toter Knopf – kurzer Hinweis, dann wie bisher das Werksnavi (mit Rückfrage)
            toast(t('navi.fue_rueckfall', 'Die Panoptes-Führung ist gerade nicht verfügbar. Es geht über das Werksnavi.'), false);
            var e0 = this.ersteEtappe();
            this.send(e0.name, e0.lat, e0.lng, btn);
        },
        // Nächstes Ziel fürs Werksnavi: erste Etappe laut Planer (Zwischenstopp oder Ladestopp); ohne Plan bzw. ohne
        // Zwischenziele in der Antwort der erste eigene Zwischenstopp (E2E B: sonst ging das Endziel hinaus), erst dann das Ziel
        ersteEtappe: function () {
            var et = this.plan ? PE.etappen(this.plan) : [];
            if (et.length && et[0].art !== 'ziel') return { name: et[0].name || this.dest.name, lat: et[0].lat, lng: et[0].lon };
            if (this.via.length) return { name: this.via[0].name, lat: this.via[0].lat, lng: this.via[0].lng };
            return { name: this.dest.name, lat: this.dest.lat, lng: this.dest.lng };
        },
        wireSend: function () {
            var self = this;
            var b = $('nSend'), s = $('nSendStop');
            if (this.fuehrungAn()) {
                if (b) b.onclick = function () { self.fuehre(b); };
                if (s) s.onclick = function () { var e0 = self.ersteEtappe(); self.send(e0.name, e0.lat, e0.lng, s); };
                return;
            }
            if (b) b.onclick = function () { self.send(self.dest.name, self.dest.lat, self.dest.lng, b); };
            var et = this.plan ? PE.etappen(this.plan) : [];
            if (s && et.length && et[0].art !== 'ziel') {
                var e0 = et[0];
                s.onclick = function () { self.send(e0.name || self.dest.name, e0.lat, e0.lon, s); };
            } else if (s && this.plan && this.plan.stopps && this.plan.stopps.length) {
                var st = this.plan.stopps[0].saeule;
                s.onclick = function () { self.send(st.name, st.lat, st.lon, s); };
            }
        },
        // Eine Ladestopp-Zeile (bisherige Liste und Etappen); vor = Zusatz vorne in der kleinen Zeile
        stopLi: function (st, label, vor) {
            var self = this, s = st.saeule;
            var bl = PB.belegung(s);
            return '<li><span class="no">' + esc(label) + '</span><span>' + esc(s.name) + ' · ' + esc(s.kw || '?') + ' kW'
                + '<small>' + (vor ? esc(vor) + ' · ' : '') + 'km ' + fmt(s.km_auf_route) + ' · ' + fmt(st.soc_vorher) + ' → ' + fmt(st.soc_nachher) + ' % · ~' + fmt(st.ladedauer_min) + ' min'
                + (s.preis_live_ct_kwh ? ' · ' + fmt(s.preis_live_ct_kwh) + ' ct/kWh' : '') + '</small>'
                + (bl ? '<small class="n-occ ' + (bl.frei > 0 ? 'ok' : 'warn') + '">'
                    + esc(t('navi.stop_frei', '{f} von {p} Ladepunkten frei', { f: bl.frei, p: bl.ladepunkte }))
                    + standHtml(PB.standMs(s.frei_stand_min == null ? null : s.frei_stand_min * 60, self.planEmpfangen))
                    + '</small>' : '')
                + '</span></li>';
        },
        // Etappen (Z und L in Fahrreihenfolge, wie die PR-Karte), je Etappe Länge und Akku bei der Ankunft
        etappenHtml: function (et) {
            var self = this, min = +$('nArrive').value || 0, nL = 0;
            var h = '<div class="n-et-kopf">' + esc(t('navi.et_titel', 'Etappen')) + '</div><ul class="n-stops n-etappen">';
            et.forEach(function (p) {
                var km = t('navi.et_km', '{km} km', { km: fmt(p.etappe_km, p.etappe_km < 20 ? 1 : 0) });
                if (p.art === 'l') { nL += 1; h += self.stopLi(p.stopp, 'L' + nL, km); return; }
                var info = [km];
                if (p.akku != null) info.push(t('navi.et_an', 'Ankunft mit {p} %', { p: fmt(p.akku) }));
                if (p.art === 'z' && p.aufenthalt_min) info.push(t('navi.et_halt', '{m} min Halt', { m: p.aufenthalt_min }));
                if (p.art === 'z' && p.weiter != null) info.push(t('navi.et_weiter', 'weiter mit {p} %', { p: fmt(p.weiter) }));
                h += '<li><span class="no z' + (p.art === 'ziel' ? ' ziel' : '') + '">' + (p.art === 'ziel' ? '◎' : 'Z' + p.nr) + '</span><span>'
                    + esc(p.art === 'ziel' ? self.dest.name : p.name)
                    + '<small' + (p.akku != null && p.akku < min ? ' class="warn"' : '') + '>' + esc(info.join(' · ')) + '</small>'
                    + (p.art === 'z' && p.laden && p.laden.hinweis ? '<small class="warn">' + esc(p.laden.hinweis) + '</small>' : '')
                    + '</span></li>';
            });
            // mit Panoptes-Führung fährt sie alle Zwischenstopps ab; nur das Werksnavi kennt ein einziges Ziel
            return h + '</ul>' + (this.fuehrungAn() ? ''
                : '<div class="n-warn">' + esc(t('navi.et_ein_ziel', 'Das Navi im Auto kennt nur ein Ziel. Starte die Etappen nacheinander.')) + '</div>');
        },

        draw: function (d) {
            var self = this;
            var geo = (d.route.geometrie || []).map(function (p) { return [p[1], p[0]]; });
            var panel = document.querySelector('.n-panel');
            // Route nicht unter dem Bedienfeld verstecken (Handy: unten, sonst links).
            var pad = window.innerWidth > 720
                ? { top: 50, right: 60, bottom: 40, left: panel.offsetWidth + 50 }
                : { top: 40, right: 50, bottom: Math.min(panel.offsetHeight, document.getElementById('nMap').offsetHeight * 0.55) + 20, left: 30 };
            this.map.setLines([{ coords: geo, color: '#5FD6E6' }], { fit: true, padding: pad });
            var ms = this.grundMarker(), et = PE.etappen(d);
            (d.stopps || []).forEach(function (st, i) {
                ms.push({ lat: st.saeule.lat, lng: st.saeule.lon, kind: 'stop', label: (et.length ? 'L' : '') + (i + 1), title: st.saeule.name });
            });
            this.map.setMarkers(ms);

            var arrive = d.soc_ankunft;
            var cost = d.kosten && d.kosten.basis && d.kosten.basis.gesamt;
            var h = this.destHtml() + '<div class="n-tiles">'
                + '<div class="n-tile"><div class="k">' + esc(t('navi.km', 'Strecke')) + '</div><div class="v">' + fmt(d.route.km, d.route.km < 20 ? 1 : 0) + '<small>km</small></div></div>'
                + '<div class="n-tile"><div class="k">' + esc(t('navi.time', 'Fahrzeit')) + '</div><div class="v">' + esc(dur(d.route.minuten)) + '</div></div>'
                + '<div class="n-tile"><div class="k">' + esc(t('navi.arrive', 'Ankunft mit')) + '</div><div class="v ' + (arrive >= 20 ? 'ok' : 'warn') + '">' + fmt(arrive) + '<small>%</small></div></div>'
                + '<div class="n-tile"><div class="k">' + esc(t('navi.stops', 'Ladestopps')) + '</div><div class="v">' + (d.stopps || []).length
                + (cost ? '<small> · ' + fmt(cost, 2) + ' €</small>' : '') + '</div></div></div>';
            if (et.length) h += this.etappenHtml(et);
            if (d.stopps && d.stopps.length) {
                if (!et.length) {
                    h += '<ul class="n-stops">';
                    d.stopps.forEach(function (st, i) { h += self.stopLi(st, String(i + 1)); });
                    h += '</ul>';
                }
                // Pflicht-Namensnennung der Live-Quellen, nur wenn eine Belegung angezeigt wird
                var lq = (d.live_quellen || []).filter(function (q) { return typeof q === 'string' && q; });
                if (lq.length && d.stopps.some(function (st) { return PB.belegung(st.saeule); })) {
                    h += '<div class="n-occ-q">' + esc(t('navi.live_quelle', 'Belegung: {q}', { q: lq.join(', ') })) + '</div>';
                }
            }
            (d.warnungen || []).filter(function (w) { return w.indexOf('deckt nicht alle') < 0; }).slice(0, 2).forEach(function (w) {
                h += '<div class="n-warn">' + esc(w) + '</div>';
            });
            h += this.sendHtml(et.length > 1 ? 'etappe' : (d.stopps && d.stopps.length));
            var turns = d.route.manoever || [];
            if (turns.length) {
                h += '<details class="n-turns"><summary>' + esc(t('navi.turns', 'Abbiegehinweise ({n})', { n: turns.length })) + '</summary><ol>';
                turns.forEach(function (m) { h += '<li>' + esc(m.text) + (m.km ? ' <small>(' + fmt(m.km, 1) + ' km)</small>' : '') + '</li>'; });
                h += '</ol></details>';
            }
            $('nOut').innerHTML = h;
            this.wireSend();
        },

        // ---------- Ziel ans Navi im Auto (BYD-Navi über /api/telenav/navigate;
        // ist das Auto aus, wird es beim nächsten Start angeboten)
        send: function (name, lat, lng, btn) {
            var imNavi = imAuto();   // am Auto-Display wird im Navi gestartet, nichts ans Auto geschickt
            frage(imNavi ? t('navi.frage_werk_titel', 'Im Werksnavi starten') : t('navi.frage_send_titel', 'Ziel ins Auto'),
                  imNavi ? t('navi.confirm_send_display', 'Navigation zu „{name}“ starten?', { name: name })
                         : t('navi.confirm_send', '„{name}“ ans Navi im Auto schicken?', { name: name }),
                  imNavi ? t('navi.send_display', 'Starten') : t('navi.frage_send_ja', 'Schicken'), false).then(function (ja) {
            if (!ja) return;
            if (btn) btn.disabled = true;
            post('/api/telenav/navigate', { name: name, lat: lat, lng: lng, replace: true }).then(function (d) {
                var ok = !!(d && d.success);
                toast(ok ? (d.queued ? t('navi.queued', 'Auto ist aus – das Ziel wird beim nächsten Start angeboten.') : (imNavi ? t('navi.sent_display', 'Navigation läuft.') : t('navi.sent', 'Ziel ist im Navi des Autos.')))
                         : ((d && (d.error || d.message)) || (imNavi ? t('navi.send_fail_display', 'Konnte die Navigation nicht starten.') : t('navi.send_fail', 'Konnte das Ziel nicht ans Auto schicken.'))), ok);
            }).catch(function () { toast(imNavi ? t('navi.send_fail_display', 'Konnte die Navigation nicht starten.') : t('navi.send_fail', 'Konnte das Ziel nicht ans Auto schicken.'), false); })
              .then(function () { if (btn) btn.disabled = false; });
            });
        },

        // ---------- Ladesäulen rund ums Auto (live belegt/frei, wo der Planer Live-Daten hat)
        // Datenschutz 03.11.: Position nur auf 2 Nachkommastellen (~1 km) hinaus, Radius +1 km; welche Säulen die
        // nächsten sind, rechnet das Gerät mit der genauen Position (PanoptesBelegung.naechste).
        nearby: function () {
            var self = this, c = this.car() || (this.map && this.map.map ? { lat: this.map.map.getCenter().lat, lng: this.map.map.getCenter().lng } : null);
            if (!c) return;
            var btn = $('nNearby'); btn.disabled = true;
            var kwh = self.standardKwh > 0 ? self.standardKwh : PB.STANDARD_KWH;
            PB.holen(function (body) { return planer('/api/navi/umkreis', body); }, c.lat, c.lng, 10, 60,
                     { kwh: kwh, meineKarten: true })
                .then(function (r) {
                    var ms = [], jetzt = Date.now();
                    self.nah = { r: r, c: c, kwh: kwh, empfangen: jetzt };
                    self.nahZeigen();
                    r.stationen.forEach(function (s) {
                        var bl = PB.belegung(s), sm = bl ? PB.standMs(s.live_alter_s, jetzt) : null;
                        ms.push({ lat: s.lat, lng: s.lon, kind: bl ? (bl.frei > 0 ? 'free' : 'busy') : 'ac',
                                  label: s.kw >= 50 ? 'DC' : 'AC',
                                  title: s.name + ' · ' + (s.kw || '?') + ' kW' + (bl ? ' · ' + bl.frei + '/' + bl.ladepunkte + ' ' + t('navi.free', 'frei')
                                      + (sm != null ? ' · ' + PB.standText(sm, t) : '') : '') });
                    });
                    if (self.dest) ms.push({ lat: self.dest.lat, lng: self.dest.lng, kind: 'dest', label: '◎', title: self.dest.name });
                    self.map.setMarkers(ms);
                    toast(t('navi.nearby_n', '{n} Säulen im Umkreis von 10 km', { n: ms.length - (self.dest ? 1 : 0) }), true);
                }).catch(function (e) { toast(e.message || t('navi.offline', 'Planer nicht erreichbar'), false); })
                .then(function () { btn.disabled = false; });
        },

        // ---------- „Nächste“ / „Günstigste in der Nähe“ (03.11.2026, Rechnung im Gerät, keine weitere Anfrage)
        nahTab: 'naechste',
        nahZeigen: function () {
            var self = this, box = $('nNah'), n = this.nah;
            if (!n) { box.hidden = true; return; }
            var tab = this.nahTab, h = '<div class="n-tabs">'
                + '<button type="button" data-nah="naechste"' + (tab === 'naechste' ? ' class="on"' : '') + '>' + esc(t('navi.nah_naechste', 'Nächste')) + '</button>'
                + '<button type="button" data-nah="guenstig"' + (tab === 'guenstig' ? ' class="on"' : '') + '>' + esc(t('navi.nah_guenstig', 'Günstigste in der Nähe')) + '</button></div>';
            var ziele = [];
            function belegtHtml(bl, s) {
                if (!bl) return '';
                var sm = PB.standMs(s.live_alter_s, n.empfangen);
                return ' · <span class="' + (bl.frei > 0 ? 'ok' : 'warn') + '">'
                    + esc(bl.frei > 0 ? t('navi.stop_frei', '{f} von {p} Ladepunkten frei', { f: bl.frei, p: bl.ladepunkte }) : t('navi.nah_belegt', 'belegt'))
                    + '</span>' + standHtml(sm);
            }
            if (tab === 'naechste') {
                var liste = n.r.stationen.slice(0, 8);
                h += '<ul class="n-stops">';
                liste.forEach(function (s, i) {
                    ziele.push(s);
                    var km = PB.distKm(n.c.lat, n.c.lng, s.lat, s.lon);
                    h += '<li data-i="' + i + '"><span class="no">' + (i + 1) + '</span><span>' + esc(s.name) + ' · ' + esc(s.kw || '?') + ' kW'
                        + '<small>' + fmt(km, 1) + ' km' + belegtHtml(PB.belegung(s), s) + '</small></span></li>';
                });
                h += '</ul>';
            } else {
                var g = PB.guenstigste(n.r.stationen, n.c.lat, n.c.lng, { kwh: n.kwh, verbrauch: this.status && this.status.verbrauchKwh100 });
                if (!g.length) {
                    h += '<div class="n-msg">' + esc(t('navi.nah_keine', 'Keine Empfehlung: Für die Säulen bis 10 km ist kein Preis bekannt.')) + '</div>';
                } else {
                    h += '<ul class="n-stops">';
                    g.forEach(function (x, i) {
                        ziele.push(x.s);
                        var z = t('navi.nah_zeile', '~{p} €/kWh · {km} km', { p: fmt(x.e.preis, 2), km: fmt(x.km, 1) });
                        if (x.e.quelle === 'eigen') z += ' · ' + t('navi.nah_eigen', 'dein Preis laut Säule');
                        if (x.istNaechste) z += ' · ' + t('navi.nah_ist_naechste', 'nächste mit Preis');
                        else if (x.ersparnis >= 0.05) z += ' · ' + t('navi.nah_ersparnis', 'Ersparnis ~{e} € gegenüber nächster', { e: fmt(x.ersparnis, 2) });
                        h += '<li data-i="' + i + '"><span class="no">' + (i + 1) + '</span><span>' + esc(x.s.name) + ' · ' + esc(x.s.kw || '?') + ' kW'
                            + '<small>' + esc(z) + belegtHtml(x.belegung, x.s) + '</small></span></li>';
                    });
                    h += '</ul>';
                    var v = this.status && this.status.verbrauchKwh100;
                    h += '<div class="basis">' + esc(t('navi.nah_basis', 'Für {kwh} kWh, mit Hin- und Rückweg ({v} kWh/100 km)',
                        { kwh: fmt(n.kwh), v: fmt(v >= 5 && v <= 60 ? v : PB.VERBRAUCH_RUECKFALL, 1) })) + '</div>';
                }
            }
            box.innerHTML = h;
            box.hidden = false;
            Array.prototype.forEach.call(box.querySelectorAll('[data-nah]'), function (b) {
                b.onclick = function () { self.nahTab = b.getAttribute('data-nah'); self.nahZeigen(); };
            });
            Array.prototype.forEach.call(box.querySelectorAll('li[data-i]'), function (li) {
                li.onclick = function () {
                    var s = ziele[+li.getAttribute('data-i')];
                    if (s) self.pick({ name: s.name, full: s.adresse || s.name, lat: s.lat, lng: s.lon }, 'saeule');
                };
            });
        },

        init: function () {
            var self = this;
            this.map = PanoptesMap.create($('nMap'), { zoom: 13, pitch: 45, followCar: true });
            var p = PanoptesShell.profile();
            if (p) this.map.setAppearance({ modelId: p.modelId, color: p.color });
            document.addEventListener('panoptes:profile', function () {
                var pr = PanoptesShell.profile(); self.map.setAppearance({ modelId: pr.modelId, color: pr.color });
            });
            // Tippen auf die Karte setzt das Ziel dorthin.
            this.map.onClick(function (ll) {
                self.pick({ name: t('navi.pin', 'Punkt auf der Karte'), full: ll.lat.toFixed(5) + ', ' + ll.lng.toFixed(5), lat: ll.lat, lng: ll.lng }, 'karte');
            });
            $('nQuery').addEventListener('input', function () {
                var q = this.value.trim();
                $('nClear').hidden = !q;
                clearTimeout(self.searchTimer);
                // Geteilter Karten-Link (Google Maps, Waze, geo:): im Auto lesen, nie als Suchtext an den Planer
                if (self.istLink(q)) { self.searchGen++; self.linkZiel(q, false); return; }
                self.searchTimer = setTimeout(function () { self.search(q); }, 350);
            });
            // × leert beim Hinzufügen nur die Suche (Ziel und Liste bleiben), sonst wie bisher das Ziel
            $('nClear').onclick = function () {
                if (!self.viaNeu) { self.clear(); return; }
                self.searchGen++; $('nResults').innerHTML = ''; $('nQuery').value = ''; $('nClear').hidden = true;
            };
            this.viaZeigen();
            $('nArrive').onchange = function () { if (self.dest) self.route(); };
            // „Ankommen mit mind.“ aus laden.ankunftSocMin vorbelegen (vom Auto; null = Standard des Planers)
            if (window.PanoptesEinstellungen) PanoptesEinstellungen.laden().then(function (st) {
                var k = st && st.feld('laden.standardKwh') ? st.wert('laden.standardKwh').wert : null;
                if (typeof k === 'number' && k > 0) self.standardKwh = k;
                var w = st && st.feld('laden.ankunftSocMin') ? st.wert('laden.ankunftSocMin').wert : null;
                if (typeof w !== 'number') return;
                var sel = $('nArrive'), da = false;
                for (var i = 0; i < sel.options.length; i++) if (+sel.options[i].value === w) da = true;
                if (!da) { var o = document.createElement('option'); o.value = String(w); o.textContent = w + ' %'; sel.appendChild(o); }
                sel.value = String(w);
            });
            $('nNearby').onclick = function () { self.nearby(); };
        }
    };

    var origRefresh = BYD.core.refreshStatus.bind(BYD.core);
    BYD.core.refreshStatus = function () {
        return origRefresh().then(function (st) { if (st) N.fromStatus(st); return st; });
    };
    BYD.i18n.init().then(function () {
        BYD.core.init();
        N.init();
        // 0.1.12: Favoriten aus der Ortsliste (GET /api/orte, eigenschaften.favorit) als Schnellziele; bleibt im Auto
        fetch('/api/orte', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (d) {
            var fav = ((d && d.liste) || []).filter(function (o) { return o.eigenschaften && o.eigenschaften.favorit && typeof o.lat === 'number'; });
            var box = $('nFav');
            if (!fav.length) return;
            fav.forEach(function (o) {
                var b = document.createElement('button'); b.type = 'button'; b.textContent = '★ ' + o.name;
                b.onclick = function () { N.pick({ name: o.name, full: o.name, lat: o.lat, lng: o.lon }, 'fav'); };
                box.appendChild(b);
            });
            box.hidden = false;
        });
        FG.init();
        $('nQuery').placeholder = t('navi.where', 'Wohin?');
        UW.start();
        PR.start();
        FU.start();
        if (imAuto()) document.body.className += ' n-gross';
        // 0.1.38.14: Kartenquelle „keine“ → kurzer Hinweis mit dem Weg zum Einschalten (kartenquelle.js bleibt unverändert)
        try {
            if (window.PanoptesKartenquelle && PanoptesKartenquelle.get() === 'keine') {
                $('nKarteAus').textContent = t('navi.karte_aus', 'Die Karte ist aus. Einschalten: Einstellungen → Alle Einstellungen → Auto & Anzeige → Kartenquelle.');
                $('nKarteAus').hidden = false;
            }
        } catch (e) {}
        setInterval(function () { PB.auffrischen(document, t); }, 30000);   // „Stand vor x min“ mitlaufen lassen
    });
})();
</script>
</body>
</html>
