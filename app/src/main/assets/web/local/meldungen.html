<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Alle Meldungen - Panoptes</title>
    <link rel="icon" type="image/webp" href="../shared/app-icon-dark.webp">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="../shared/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Panoptes">
    <meta name="theme-color" content="#0A2238">
    <script src="../shared/theme.js?v=13"></script>
    <script src="../shared/app-shell.js?v=pn27"></script>
    <link rel="stylesheet" href="../shared/styles.css?v=pn11">
    <style>
        /* 0.1.28 P4 (Kern A): alle Meldungen auf einer Seite. REGEL DAU: je Thema zwei große Schalter, wenig Text. */
        .mw { padding: 0 28px 60px; max-width: 820px; box-sizing: border-box; }
        .gc { background: var(--sm-card); border: 1px solid var(--sm-line); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
        .gc h2 { font-family: var(--family-display); font-size: 18px; font-weight: 700; color: var(--on-surface); margin: 0 0 6px; }
        .gc .lead { color: var(--on-surface-variant); font-size: 15px; margin: 0; line-height: 1.5; }
        .kopf, .row { display: flex; align-items: center; }
        .kopf { padding: 0 0 8px; color: var(--outline); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
        .row { padding: 14px 0; border-top: 1px solid var(--sm-line); }
        .txt { flex: 1; min-width: 0; padding-right: 12px; }
        .txt b { display: block; font-weight: 700; color: var(--on-surface); font-size: 17px; }
        .txt small { display: block; color: var(--outline); font-size: 13.5px; margin-top: 3px; line-height: 1.45; }
        .sp { width: 86px; flex: none; text-align: center; }
        .sp small { display: block; color: var(--outline); font-size: 11.5px; margin-top: 4px; min-height: 14px; }
        .sw { position: relative; display: inline-block; width: 58px; height: 34px; }
        .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
        .sw i { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 999px; background: rgba(255, 255, 255, .14);
                transition: background .2s; cursor: pointer; }
        .sw i::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #EAF6F8; transition: transform .2s; }
        .sw input:checked + i { background: var(--sm-lime); }
        .sw input:checked + i::after { transform: translateX(24px); background: #1d2a00; }
        .sw.teil i { background: rgba(198, 255, 0, .35); }
        .sw input:disabled + i { cursor: not-allowed; opacity: .4; }
        .sw input:focus-visible + i { outline: 2px solid var(--sm-aqua); outline-offset: 2px; }
        .strich { color: var(--outline); font-size: 20px; }
        .hinweis { display: flex; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .05);
                   margin: 10px 0 0; color: var(--on-surface); font-size: 14.5px; }
        .hinweis[hidden] { display: none; }
        .hinweis span { flex: 1; min-width: 160px; margin-right: 10px; }
        .gbtn { border: 1px solid var(--sm-line); background: rgba(255, 255, 255, .075); color: var(--on-surface); border-radius: 12px;
                padding: 12px 16px; font: 700 15px var(--family-body, sans-serif); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; margin: 6px 8px 0 0; }
        .gbtn.lime { background: var(--sm-lime); color: #1d2a00; border-color: transparent; }
        .times { display: flex; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 15px; color: var(--on-surface); }
        .times input[type=time] { background: rgba(255, 255, 255, .07); border: 1px solid var(--sm-line); border-radius: 10px; color: var(--on-surface);
                                  font: 700 16px var(--family-body, sans-serif); padding: 9px 10px; margin: 4px 10px 4px 6px; }
        .note { font-size: 14px; color: var(--on-surface-variant); margin-top: 10px; min-height: 18px; }
        .note.ok { color: var(--sm-lime); }
        .note.err { color: var(--status-error, #ff8a80); }
        .mehr a { color: var(--sm-aqua); font-weight: 600; margin-right: 18px; display: inline-block; margin-top: 6px; }
        @media (max-width: 720px) { .mw { padding: 0 12px 24px; } .sp { width: 72px; } .txt b { font-size: 16px; } }
    </style>
</head>
<body>
<div class="app-layout">
    <div id="app-shell-mount"></div>
    <main class="main-content">
        <div class="mw">
            <article class="gc">
                <p class="lead" data-i18n="meldungen.lead">Hier stellst du ein, was dir das Auto schickt.</p>
                <div class="hinweis" id="keinHandy" hidden>
                    <span data-i18n="meldungen.kein_handy">Noch kein Handy bekommt Meldungen.</span>
                    <a class="gbtn" href="notifications.html" data-i18n="meldungen.handy_verbinden">Handy verbinden</a>
                </div>
                <div class="hinweis" id="keinTelegram" hidden>
                    <span data-i18n="meldungen.kein_telegram">Telegram ist nicht verbunden.</span>
                    <a class="gbtn" href="telegram.html" data-i18n="meldungen.telegram_verbinden">Telegram verbinden</a>
                </div>
            </article>

            <article class="gc">
                <div class="kopf">
                    <div class="txt"></div>
                    <div class="sp" data-i18n="meldungen.handy">Handy</div>
                    <div class="sp" data-i18n="meldungen.telegram">Telegram</div>
                </div>
                <div id="themen"><div class="note" data-i18n="meldungen.laden">Lädt …</div></div>
                <div class="note" id="themenMsg" role="status" aria-live="polite"></div>
            </article>

            <article class="gc">
                <h2 data-i18n="meldungen.ruhe_title">Nachtruhe</h2>
                <p class="lead" data-i18n="meldungen.ruhe_text">In dieser Zeit kommen nur Alarme.</p>
                <div class="row" style="border-top:0">
                    <div class="txt"><b data-i18n="meldungen.ruhe_an">Nachtruhe an</b></div>
                    <label class="sw"><input type="checkbox" id="rAn"><i></i></label>
                </div>
                <div class="times">
                    <span data-i18n="meldungen.von">von</span><input type="time" id="rVon" value="22:00">
                    <span data-i18n="meldungen.bis">bis</span><input type="time" id="rBis" value="07:00">
                </div>
                <div class="note" id="ruheMsg" role="status" aria-live="polite"></div>
            </article>

            <p class="mehr">
                <a href="notifications.html" data-i18n="meldungen.genauer">Genauer einstellen</a>
                <a href="telegram.html">Telegram</a>
            </p>
        </div>
    </main>
</div>
<div id="toastContainer" class="toast-container"></div>

<script src="../shared/auth.js"></script>
<script src="../shared/pwa-init.js?v=index1"></script>
<script src="../shared/core.js?v=pn6"></script>
<script>
// ES5 (Chrome 58 / Android 7.1 am Autoschirm). Daten: GET/POST /api/notifications/themen.
(function () {
    'use strict';
    function $(id) { return document.getElementById(id); }
    function t(k, f) {
        var v = (window.BYD && BYD.i18n && BYD.i18n.t) ? BYD.i18n.t(k) : null;
        return (v && v !== k) ? v : f;
    }
    function msg(id, text, kind) { var el = $(id); el.textContent = text || ''; el.className = 'note' + (kind ? ' ' + kind : ''); }
    function senden(body) {
        return fetch('/api/notifications/themen', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body) }).then(function (r) { return r.json(); });
    }

    var stand = null;

    function schalter(thema, feld, moeglich) {
        var td = document.createElement('div');
        td.className = 'sp';
        var wert = thema[feld];
        if (!moeglich) {
            var s = document.createElement('span');
            s.className = 'strich';
            s.textContent = '–';
            td.appendChild(s);
            return td;
        }
        var lab = document.createElement('label');
        lab.className = 'sw' + (thema[feld + 'Teilweise'] ? ' teil' : '');
        var inp = document.createElement('input');
        inp.type = 'checkbox';
        inp.checked = wert === true;
        inp.disabled = wert === null || wert === undefined;
        inp.setAttribute('aria-label', t('meldungen.thema.' + thema.id + '.label', thema.label) + ' – '
            + (feld === 'handy' ? t('meldungen.handy', 'Handy') : t('meldungen.telegram', 'Telegram')));
        inp.onchange = function () {
            var b = { thema: thema.id };
            b[feld] = inp.checked;
            inp.disabled = true;
            senden(b).then(function (r) {
                if (!r || !r.success) throw new Error('x');
                zeichnen(r);
                msg('themenMsg', t('meldungen.gespeichert', 'Gespeichert'), 'ok');
            }).catch(function () {
                inp.checked = !inp.checked;
                inp.disabled = false;
                msg('themenMsg', t('meldungen.fehler', 'Hat nicht geklappt. Bitte noch einmal tippen.'), 'err');
            });
        };
        lab.appendChild(inp);
        lab.appendChild(document.createElement('i'));
        td.appendChild(lab);
        var klein = document.createElement('small');
        klein.textContent = thema[feld + 'Teilweise'] ? t('meldungen.teilweise', 'teilweise an') : '';
        td.appendChild(klein);
        return td;
    }

    function zeichnen(r) {
        stand = r;
        $('keinHandy').hidden = r.geraete > 0;
        $('keinTelegram').hidden = !!r.telegramVerbunden;
        var box = $('themen');
        box.innerHTML = '';
        for (var i = 0; i < r.themen.length; i++) {
            var th = r.themen[i];
            var row = document.createElement('div');
            row.className = 'row';
            row.setAttribute('data-thema', th.id);
            var txt = document.createElement('div');
            txt.className = 'txt';
            var b = document.createElement('b');
            b.textContent = t('meldungen.thema.' + th.id + '.label', th.label);
            var sm = document.createElement('small');
            sm.textContent = t('meldungen.thema.' + th.id + '.note', '');
            txt.appendChild(b);
            txt.appendChild(sm);
            row.appendChild(txt);
            row.appendChild(schalter(th, 'handy', th.handyMoeglich));
            row.appendChild(schalter(th, 'telegram', th.telegramMoeglich));
            box.appendChild(row);
        }
        var q = r.ruhezeit || {};
        $('rAn').checked = !!q.enabled;
        if (q.from) $('rVon').value = q.from;
        if (q.to) $('rBis').value = q.to;
    }

    function ruheSpeichern() {
        senden({ ruhezeit: { an: $('rAn').checked, von: $('rVon').value || '22:00', bis: $('rBis').value || '07:00' } })
            .then(function (r) {
                if (!r || !r.success) throw new Error('x');
                zeichnen(r);
                msg('ruheMsg', t('meldungen.gespeichert', 'Gespeichert'), 'ok');
            }).catch(function () {
                msg('ruheMsg', t('meldungen.fehler', 'Hat nicht geklappt. Bitte noch einmal tippen.'), 'err');
            });
    }

    function laden() {
        fetch('/api/notifications/themen', { cache: 'no-store' }).then(function (r) { return r.json(); })
            .then(function (r) {
                if (!r || !r.success) throw new Error('x');
                zeichnen(r);
            }).catch(function () {
                msg('themenMsg', t('meldungen.fehler', 'Hat nicht geklappt. Bitte noch einmal tippen.'), 'err');
            });
    }

    BYD.i18n.init().then(function () {
        BYD.core.init();
        $('rAn').onchange = ruheSpeichern;
        $('rVon').onchange = ruheSpeichern;
        $('rBis').onchange = ruheSpeichern;
        laden();
    });
})();
</script>
</body>
</html>
